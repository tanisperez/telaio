[package]
name = "telaio-app"
description = "Application shell shared by Postino, Vano and Nastro: logging, command line pieces, language, numbers, paths and window bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
gpui-kit = { workspace = true }
telaio-ui = { path = "../telaio-ui" }
rust-i18n = { workspace = true }
serde = { workspace = true, features = ["derive"] }
log = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
sys-locale = { workspace = true }
icu_decimal = { workspace = true }
icu_locale_core = { workspace = true }

# `AttachConsole`, so the output reaches the terminal from a GUI subsystem binary.
# Already in the tree at this version (async-io, through gpui-base).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
