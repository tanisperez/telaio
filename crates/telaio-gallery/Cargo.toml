[package]
name = "telaio-gallery"
description = "Every telaio component in every state, under every sample palette"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "telaio-gallery"
path = "src/main.rs"

[dependencies]
# The grammars of the code editor demos, the same ones Postino enables (JSON comes with the
# base "tree-sitter" feature, XML uses the HTML grammar).
gpui-kit = { workspace = true, features = ["tree-sitter-javascript", "tree-sitter-html"] }
rust-i18n = { workspace = true }
telaio-ui = { path = "../telaio-ui" }

[lints]
workspace = true
