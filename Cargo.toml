[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]
repository = "https://github.com/tanisperez/telaio"

[workspace.dependencies]
# The exact pin of the apps that use telaio: gpui-kit 0.7.0 bundles gpui-component and gpui-base
# and pins gpui-pre 0.3.7. Upgrading it means a new telaio release and an upgrade in every app,
# and `cargo tree -d --depth 0 | grep gpui` must stay empty there.
gpui-kit = "0.7.0"
serde_json = "1"
# The same version as the apps, already built by gpui-component (translations).
rust-i18n = "4.2"
pretty_assertions = "1.4"
# The updater (telaio-update). The same requirements as the apps, so they get no duplicates.
ureq = "3.4"
serde = "1"
thiserror = "2"
log = "0.4"
semver = "1"
sha2 = "0.11"
dirs = "7"
tempfile = "3"
tiny_http = "0.12"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
